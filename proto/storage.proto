syntax = "proto3";

package qbctl.v1;

enum ManagedRootView {
  MANAGED_ROOT_VIEW_UNSPECIFIED = 0;
  MANAGED_ROOT_VIEW_INCOMING = 1;
  MANAGED_ROOT_VIEW_ARCHIVE = 2;
  MANAGED_ROOT_VIEW_WORKING = 3;
  MANAGED_ROOT_VIEW_COMPLETED = 4;
  MANAGED_ROOT_VIEW_RUNTIME = 5;
}

message StorageStatusRequest {}

message StorageRootStatus {
  ManagedRootView root = 1;
  string path = 2;
  uint64 volume_id = 3;
  uint64 free_bytes = 4;
  uint64 total_bytes = 5;
}

message StorageStatusResponse {
  repeated StorageRootStatus roots = 1;
}

message StorageListRequest {}

enum IncomingEntryState {
  INCOMING_ENTRY_STATE_UNSPECIFIED = 0;
  INCOMING_ENTRY_STATE_ELIGIBLE = 1;
  INCOMING_ENTRY_STATE_ALREADY_PROCESSED = 2;
  INCOMING_ENTRY_STATE_REDUNDANT_IDENTICAL = 3;
  INCOMING_ENTRY_STATE_REJECTED = 4;
}

message IncomingEntry {
  string relative_path = 1;
  IncomingEntryState state = 2;
  optional string registry_id = 3;
  optional string registry_state = 4;
  optional string canonical_path = 5;
  optional string problem_code = 6;
}

message StorageListResponse {
  repeated IncomingEntry incoming = 1;
}
