syntax = "proto3";

package qbctl.v1;

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_PENDING = 2;
  STATUS_PARTIAL = 3;
  STATUS_BLOCKED = 4;
  STATUS_UNKNOWN = 5;
  STATUS_ERROR = 6;
}

enum ProblemCategory {
  PROBLEM_CATEGORY_UNSPECIFIED = 0;
  PROBLEM_CATEGORY_USAGE = 1;
  PROBLEM_CATEGORY_STATE = 2;
  PROBLEM_CATEGORY_AVAILABILITY = 3;
  PROBLEM_CATEGORY_PROTOCOL = 4;
  PROBLEM_CATEGORY_INTERNAL = 5;
}

enum RetryGuidance {
  RETRY_GUIDANCE_UNSPECIFIED = 0;
  RETRY_GUIDANCE_DO_NOT_RETRY = 1;
  RETRY_GUIDANCE_OBSERVE_OR_RECOVER = 2;
  RETRY_GUIDANCE_RETRY_SAME_REQUEST_AFTER_BACKOFF = 3;
  RETRY_GUIDANCE_RETRY_AFTER_STATE_CHANGE = 4;
  RETRY_GUIDANCE_NEW_REQUEST_REQUIRED = 5;
}

enum MutationCertainty {
  MUTATION_CERTAINTY_UNSPECIFIED = 0;
  MUTATION_CERTAINTY_NO_MUTATION = 1;
  MUTATION_CERTAINTY_CONFIRMED_NOT_APPLIED = 2;
  MUTATION_CERTAINTY_CONFIRMED_APPLIED = 3;
  MUTATION_CERTAINTY_MAY_HAVE_APPLIED = 4;
}

message Detail {
  string key = 1;
  string value = 2;
}

message Problem {
  string code = 1;
  ProblemCategory category = 2;
  RetryGuidance retry_guidance = 3;
  MutationCertainty mutation_certainty = 4;
  string message_key = 5;
  repeated Detail details = 6;
}

message NextAction {
  string kind = 1;
  optional string target_id = 2;
}

message ClientHello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string client_version = 3;
  repeated string capabilities = 4;
}

message ServerHello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string daemon_version = 3;
  repeated string capabilities = 4;
  string instance_id = 5;
}
