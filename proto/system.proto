syntax = "proto3";

package qbctl.v1;

import "common.proto";
import "torrent.proto";

enum DaemonState {
  DAEMON_STATE_UNSPECIFIED = 0;
  DAEMON_STATE_STARTING = 1;
  DAEMON_STATE_MIGRATING = 2;
  DAEMON_STATE_RECOVERING = 3;
  DAEMON_STATE_DEGRADED = 4;
  DAEMON_STATE_READY = 5;
  DAEMON_STATE_DRAINING = 6;
  DAEMON_STATE_STOPPED = 7;
  DAEMON_STATE_FAILED = 8;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string daemon_version = 3;
  repeated string capabilities = 4;
}

message StatusRequest {}

message StatusResponse {
  DaemonState daemon_state = 1;
  string instance_id = 2;
  uint32 schema_version = 3;
  bool mutation_admission_enabled = 4;
}

enum ManagedRootView {
  MANAGED_ROOT_VIEW_UNSPECIFIED = 0;
  MANAGED_ROOT_VIEW_INCOMING = 1;
  MANAGED_ROOT_VIEW_ARCHIVE = 2;
  MANAGED_ROOT_VIEW_WORKING = 3;
  MANAGED_ROOT_VIEW_COMPLETED = 4;
}

message StorageRootView {
  ManagedRootView root = 1;
  string path = 2;
  uint64 volume_id = 3;
  uint64 free_bytes = 4;
  uint64 total_bytes = 5;
}

message StorageListRequest {}

message StorageListResponse {
  repeated StorageRootView roots = 1;
}

message StorageStatusRequest {}

message IncomingStatusEntry {
  string relative_path = 1;
  string classification = 2;
  optional string registry_id = 3;
  optional string problem_code = 4;
  optional string detail = 5;
}

message StorageStatusResponse {
  repeated StorageRootView roots = 1;
  uint32 eligible_count = 2;
  uint32 already_processed_count = 3;
  uint32 redundant_identical_count = 4;
  uint32 rejected_count = 5;
  repeated IncomingStatusEntry incoming = 6;
}

message OperationListRequest {}

message OperationGetRequest {
  string operation_id = 1;
}

message OperationRecoverRequest {
  string operation_id = 1;
}

message OperationSummary {
  string operation_id = 1;
  string request_id = 2;
  string kind = 3;
  string state = 4;
  string registry_id = 5;
  string torrent_id = 6;
  optional string problem_code = 7;
  uint64 revision = 8;
  uint32 files_total = 9;
  uint32 files_moved_and_receipted = 10;
  bool archive_receipted = 11;
  bool post_handoff_content_audited = 12;
}

message OperationFileView {
  uint32 index = 1;
  string relative_path = 2;
  uint64 size = 3;
  string strategy = 4;
  string state = 5;
  bool destination_receipted = 6;
  optional string problem_code = 7;
  uint64 revision = 8;
}

message OperationView {
  OperationSummary summary = 1;
  string source_relative = 2;
  repeated OperationFileView files = 3;
}

message OperationListResponse {
  repeated OperationSummary operations = 1;
}

message OperationGetResponse {
  OperationView operation = 1;
}

message OperationRecoverResponse {
  OperationView operation = 1;
  string execution_status = 2;
  bool replayed = 3;
}

message DoctorRequest {}

message DoctorCheck {
  string name = 1;
  bool ok = 2;
  string message = 3;
}

message DoctorResponse {
  repeated DoctorCheck checks = 1;
}

message Request {
  uint64 sequence = 1;
  optional string request_id = 2;

  oneof command {
    CapabilitiesRequest capabilities = 10;
    StatusRequest status = 11;
    DoctorRequest doctor = 12;
    TorrentListRequest torrent_list = 20;
    TorrentGetRequest torrent_get = 21;
    QueueGetRequest queue_get = 22;
    TransferLimitsGetRequest transfer_limits_get = 23;
    QbitProbeRequest qbit_probe = 24;
    TorrentDiagnoseRequest torrent_diagnose = 25;
    PauseTorrentRequest torrent_pause = 30;
    ResumeTorrentRequest torrent_resume = 31;
    QueueTargetGetRequest queue_target_get = 32;
    SetQueueTargetRequest queue_target_set = 33;
    SetActiveDownloadsRequest queue_downloads_set = 34;
    SetDownloadLimitRequest transfer_download_limit_set = 35;
    SetUploadLimitRequest transfer_upload_limit_set = 36;
    StorageListRequest storage_list = 37;
    StorageStatusRequest storage_status = 38;
    OperationListRequest operation_list = 39;
    OperationGetRequest operation_get = 40;
    OperationRecoverRequest operation_recover = 41;
  }
}

message Response {
  uint64 sequence = 1;
  Status status = 2;
  optional string request_id = 3;
  optional string operation_id = 4;
  optional string job_id = 5;
  repeated Problem problems = 6;
  repeated NextAction next_actions = 7;

  oneof payload {
    CapabilitiesResponse capabilities = 20;
    StatusResponse system_status = 21;
    DoctorResponse doctor = 22;
    TorrentListResponse torrent_list = 23;
    TorrentGetResponse torrent_get = 24;
    QueueSettingsResponse queue_settings = 25;
    TransferLimitsResponse transfer_limits = 26;
    QbitProbeResponse qbit_probe = 27;
    QueueTargetResponse queue_target = 28;
    MutationResultResponse mutation_result = 29;
    TorrentDiagnoseResponse torrent_diagnose = 30;
    StorageListResponse storage_list = 31;
    StorageStatusResponse storage_status = 32;
    OperationListResponse operation_list = 33;
    OperationGetResponse operation_get = 34;
    OperationRecoverResponse operation_recover = 35;
  }
}
