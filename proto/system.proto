syntax = "proto3";

package qbctl.v1;

import "common.proto";
import "torrent.proto";

enum DaemonState {
  DAEMON_STATE_UNSPECIFIED = 0;
  DAEMON_STATE_STARTING = 1;
  DAEMON_STATE_MIGRATING = 2;
  DAEMON_STATE_RECOVERING = 3;
  DAEMON_STATE_DEGRADED = 4;
  DAEMON_STATE_READY = 5;
  DAEMON_STATE_DRAINING = 6;
  DAEMON_STATE_STOPPED = 7;
  DAEMON_STATE_FAILED = 8;
}

message CapabilitiesRequest {}

message CapabilitiesResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string daemon_version = 3;
  repeated string capabilities = 4;
}

message StatusRequest {}

message StatusResponse {
  DaemonState daemon_state = 1;
  string instance_id = 2;
  uint32 schema_version = 3;
  bool mutation_admission_enabled = 4;
}

message DoctorRequest {}

message DoctorCheck {
  string name = 1;
  bool ok = 2;
  string message = 3;
}

message DoctorResponse {
  repeated DoctorCheck checks = 1;
}

message Request {
  uint64 sequence = 1;
  optional string request_id = 2;

  oneof command {
    CapabilitiesRequest capabilities = 10;
    StatusRequest status = 11;
    DoctorRequest doctor = 12;
    TorrentListRequest torrent_list = 20;
    TorrentGetRequest torrent_get = 21;
    QueueGetRequest queue_get = 22;
    TransferLimitsGetRequest transfer_limits_get = 23;
    QbitProbeRequest qbit_probe = 24;
    PauseTorrentRequest torrent_pause = 30;
    ResumeTorrentRequest torrent_resume = 31;
    QueueTargetGetRequest queue_target_get = 32;
    SetQueueTargetRequest queue_target_set = 33;
    SetActiveDownloadsRequest queue_downloads_set = 34;
    SetDownloadLimitRequest transfer_download_limit_set = 35;
    SetUploadLimitRequest transfer_upload_limit_set = 36;
  }
}

message Response {
  uint64 sequence = 1;
  Status status = 2;
  optional string request_id = 3;
  optional string operation_id = 4;
  optional string job_id = 5;
  repeated Problem problems = 6;
  repeated NextAction next_actions = 7;

  oneof payload {
    CapabilitiesResponse capabilities = 20;
    StatusResponse system_status = 21;
    DoctorResponse doctor = 22;
    TorrentListResponse torrent_list = 23;
    TorrentGetResponse torrent_get = 24;
    QueueSettingsResponse queue_settings = 25;
    TransferLimitsResponse transfer_limits = 26;
    QbitProbeResponse qbit_probe = 27;
    QueueTargetResponse queue_target = 28;
    MutationResultResponse mutation_result = 29;
  }
}
