name: Rust

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Refresh Slice 2 lockfile
        run: cargo generate-lockfile
      - name: Upload Slice 2 lockfile
        uses: actions/upload-artifact@v4
        with:
          name: slice-2-cargo-lock
          path: Cargo.lock
      - name: Architecture invariants
        shell: pwsh
        run: ./scripts/check-architecture.ps1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build binaries for acceptance
        run: cargo build --workspace --bins --locked
      - name: Control plane acceptance
        shell: pwsh
        run: ./scripts/test-control-plane.ps1
